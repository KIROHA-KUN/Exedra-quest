<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Judul Cerita</title>
<style>
@font-face{font-family:"Newcinema";src:url("font/Newcinema.ttf") format("truetype");font-weight:normal;font-style:normal;font-display:swap}
:root{
  --bg:#05060f;
  --bg-2:#0b0f24;
  --surface:#111739;
  --surface-2:#1a2050;
  --text:#e6e9ff;
  --text-2:#a9b0e6;
  --accent:#8f9cf0;
  --accent-2:#5b67d1;
  --silver:#9a9cab;
  --glow:rgba(143,156,240,.45);
  --nebula:#b5643f;
  --nebula-2:#8a3f7a;
  --star:#ffffff;
  --serif:"Newcinema",Georgia,"Times New Roman",serif;
  --body:"Newcinema",Georgia,Cambria,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;overflow-x:hidden;color:var(--text);
  font-family:var(--body);font-size:18px;line-height:1.8;
  background:
    radial-gradient(60% 40% at 85% 0%,rgba(138,63,122,.16),transparent 70%),
    radial-gradient(50% 35% at 5% 100%,rgba(181,100,63,.10),transparent 70%),
    linear-gradient(180deg,var(--bg-2),var(--bg) 60%);
  background-color:var(--bg);background-attachment:fixed;
}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.star{fill:var(--star);animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.ring{position:fixed;z-index:0;border-radius:50%;border:1px solid var(--accent-2);
  box-shadow:0 0 40px var(--glow),inset 0 0 40px rgba(91,103,209,.15);opacity:.35;pointer-events:none}
.ring.a{width:min(120vw,760px);height:min(120vw,760px);right:-30%;top:-15%}
.ring.b{width:min(70vw,420px);height:min(70vw,420px);left:-25%;bottom:-10%;opacity:.22}

.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:20;background:transparent;padding-top:env(safe-area-inset-top,0px)}
.progress i{display:block;height:3px;width:0;background:linear-gradient(90deg,var(--accent-2),var(--accent));box-shadow:0 0 10px var(--glow);transition:width .5s ease}

#app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:56px 22px 48px}
.view{display:none}
.view.on{display:block;animation:fade .7s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

h1,h2{font-family:var(--serif);font-weight:600;line-height:1.1;margin:0;letter-spacing:.01em}
.hero{min-height:70vh;display:flex;flex-direction:column;justify-content:center;text-align:center;align-items:center}
.hero h1{font-size:clamp(3rem,13vw,5.2rem);text-shadow:0 0 30px var(--glow)}
.tagline{color:var(--text-2);margin:18px 0 32px;max-width:26em}
.genre{color:var(--silver);font-size:.9rem;margin-top:0}

button{font:inherit;cursor:pointer}
.btn{background:var(--surface-2);color:var(--text);border:1px solid var(--accent-2);border-radius:999px;
  padding:12px 28px;min-height:44px;font-size:1rem;transition:box-shadow .3s,background .3s}
.btn:hover{background:var(--accent-2);box-shadow:0 0 22px var(--glow)}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none;background:var(--surface-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.toc{list-style:none;margin:40px 0 0;padding:0;border-top:1px solid var(--surface-2);width:100%;text-align:left}
.toc li{border-bottom:1px solid var(--surface-2)}
.toc button{all:unset;box-sizing:border-box;display:flex;gap:16px;align-items:baseline;width:100%;padding:14px 4px;cursor:pointer;color:var(--text-2);min-height:44px}
.toc button:hover{color:var(--text)}
.toc button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toc .n{font-family:var(--serif);font-size:1.3rem;color:var(--accent);min-width:1.6em}
.toc .cur{color:var(--text)}

.chapter .num{font-family:var(--serif);color:var(--accent);font-size:1.15rem;margin:0 0 6px}
.chapter h2{font-size:clamp(2.1rem,8vw,3rem);margin-bottom:28px;text-shadow:0 0 24px var(--glow)}
.chapter p{margin:0 0 1.3em;color:var(--text)}
.chapter .num{margin-top:0}
.chapter h3{font-family:var(--serif);font-weight:600;font-size:1.7rem;line-height:1.2;color:var(--accent);margin:2.2em 0 .7em}
.chapter em{color:var(--text-2)}
#chapterContent{display:block;min-height:40vh}
.navigation{display:flex;gap:10px;align-items:center;margin-top:44px}
.navigation button{background:var(--surface-2);color:var(--text);border:1px solid var(--accent-2);border-radius:999px;
  padding:10px 18px;min-height:44px;font-size:1rem;transition:box-shadow .3s,background .3s}
.navigation button:hover{background:var(--accent-2);box-shadow:0 0 22px var(--glow)}
.navigation button.disabled{opacity:.35;pointer-events:none;box-shadow:none}
.navigation select{flex:1;min-width:0;min-height:44px;font:inherit;font-size:.95rem;color:var(--text);
  background:var(--surface);border:1px solid var(--accent-2);border-radius:999px;padding:8px 14px;text-overflow:ellipsis}
.navigation select option{background:var(--surface);color:var(--text)}
.end{text-align:center;padding-top:16vh}
.end h2{font-size:clamp(2.4rem,10vw,3.6rem);text-shadow:0 0 30px var(--glow)}
.end p{color:var(--text-2);margin:16px 0 30px}
.end .btn+.btn{margin-left:8px}


@media (prefers-color-scheme:light){:root{color-scheme:dark}}
@media (prefers-reduced-motion:reduce){
  .star{animation:none;opacity:.5}
  .view.on{animation:none}
  .progress i{transition:none}
  *{scroll-behavior:auto!important}
}
</style>
</head>
<body>
<svg id="stars" aria-hidden="true"></svg>
<div class="ring a" aria-hidden="true"></div>
<div class="ring b" aria-hidden="true"></div>
<div class="progress" aria-hidden="true"><i id="bar"></i></div>

<div id="app">
  <section class="view hero" id="v-home">
    <p class="genre">MAGIA EXEDRA</p>
    <h1>Exedra Quest</h1>
    <p class="tagline">Exedra Quest adalah cerita utama dalam Magia Exedra yang berpusat pada Gadis Tanpa Nama (Namae) dan Lighthouse.</p>
    <button class="btn" id="start">Mulai Membaca</button>
    <ul class="toc" id="toc-home"></ul>
  </section>

  <article class="view chapter" id="v-chap" aria-live="polite">
    <main id="chapterContent">
      <!-- Chapter akan muncul di sini -->
    </main>

    <div class="navigation">
      <button id="prevBtn" class="disabled">Previous</button>
      <select id="jumpSelect" aria-label="Loncat ke chapter"></select>
      <button id="nextBtn">Next</button>
    </div>
  </article>

  <section class="view end" id="v-end">
    <h2>Tamat</h2>
    <p>Terima kasih sudah membaca Judul Cerita.</p>
    <button class="btn" id="again">Baca dari awal</button>
    <button class="btn" id="back">Chapter terakhir</button>
  </section>
</div>

  function save(){try{localStorage.setItem(KEY,String(pos))}catch(e){}}
  function load(){try{var v=parseInt(localStorage.getItem(KEY),10);if(!isNaN(v)&&v>=-1&&v<=N)return v}catch(e){}return -1}

  function buildToc(el){
    el.innerHTML="";
    chapters.forEach(function(c,i){
      var li=document.createElement("li"),b=document.createElement("button");
      b.innerHTML='<span class="n">'+(i+1)+'</span><span>'+c.t+'</span>';
      if(i===pos)b.className="cur";
      b.onclick=function(){go(i)};
      li.appendChild(b);el.appendChild(li);
    });
  }

  function show(id){
    ["v-home","v-chap","v-end"].forEach(function(v){$(v).classList.remove("on")});
    void $(id).offsetWidth;
    $(id).classList.add("on");
  }

  function go(i){
    pos=Math.max(-1,Math.min(N,i));
    if(pos===-1){show("v-home");buildToc($("toc-home"))}
    else if(pos===N){show("v-end")}
    else{
      var c=chapters[pos];
      $("chapterContent").innerHTML='<h2>'+c.t+'</h2>'+
        c.p.map(function(x){var m=x.indexOf("## ")===0;x=x.replace(/\*(.+?)\*/g,"<em>$1</em>");return m?"<h3>"+x.slice(3)+"</h3>":"<p>"+x+"</p>"}).join("");
      $("prevBtn").classList.toggle("disabled",pos===0);
      $("jumpSelect").value=String(pos);
      show("v-chap");
    }
    $("bar").style.width=(pos<0?0:Math.round((Math.min(pos+1,N))/N*100))+"%";
    window.scrollTo(0,0);
    save();
  }

  var sel=$("jumpSelect");
  chapters.forEach(function(c,i){var o=document.createElement("option");o.value=i;o.textContent="Chapter "+(i+1)+" - "+c.t;sel.appendChild(o)});

  $("prevBtn").onclick=function(){if(pos>0)go(pos-1)};
